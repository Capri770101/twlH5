# ============================================================
# H5 官网 Nginx 配置  —  h5.tiaowulan.com
# 部署位置（服务器 8.138.248.173，root 权限）：/etc/nginx/conf.d/h5.tiaowulan.com.conf
# 证书位置（admin 家目录，无需 root 即可上传）：
#   /home/admin/ssl/h5.tiaowulan.com.pem
#   /home/admin/ssl/h5.tiaowulan.com.key
# 前置：先把两个证书文件 scp 到 /home/admin/ssl/（chmod 644）
# ============================================================

# 80 端口：强制跳转 HTTPS（微信授权/支付只认 HTTPS）
server {
    listen 80;
    server_name h5.tiaowulan.com;
    return 301 https://$host$request_uri;
}

# 443 端口：HTTPS 主站
server {
    listen 443 ssl http2;
    server_name h5.tiaowulan.com;

    ssl_certificate     /etc/nginx/ssl/h5.tiaowulan.com/h5.tiaowulan.com.pem;
    ssl_certificate_key /etc/nginx/ssl/h5.tiaowulan.com/h5.tiaowulan.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端静态资源 + 智能体 /agent 反代，沿用现有零依赖 server.cjs（端口 8088）
    # 若后续改为 Nginx 直接托管 dist/，把 proxy_pass 改 root 指向即可
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # H5 自有后端（商品只读库 / 用户 / 订单 / 支付回调），部署 Node 后端后启用
    # 注意：/api/ 末尾斜杠必须保留，proxy_pass 目标也带斜杠，避免路径拼接错误
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 微信支付回调 notify_url：必须 HTTPS 且能被公网 POST 到
    # 若后端在 4000，上面的 /api/ 已覆盖；如需独立路径可在此加 location
}
