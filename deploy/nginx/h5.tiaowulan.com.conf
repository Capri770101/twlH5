# H5 官网 h5.tiaowulan.com —— 2026-09-09 部署（SSE 缓冲修复版）
# 前端+智能体/agent 反代复用 server.cjs(:8088)；/api 反代 Node 后端(:4000)
server {
    listen 80;
    server_name h5.tiaowulan.com;
    location / { return 301 https://$host$request_uri; }
}

# 域名停用期间的 IP 访问入口；只匹配 H5 服务器 IP，不抢占商家默认站点。
# HTTP 入口为 http://129.204.85.139/；直接使用 IP 的 HTTPS 会有证书名称提示。
server {
    listen 80;
    server_name 129.204.85.139;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl;
    server_name h5.tiaowulan.com;
    ssl_certificate     /etc/nginx/ssl/h5.tiaowulan.com/h5.tiaowulan.com.pem;
    ssl_certificate_key /etc/nginx/ssl/h5.tiaowulan.com/h5.tiaowulan.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 微信域名归属校验文件（公众号网页授权 / 小程序）
    # 放在 dist/ 之外，避免每次发版被整体替换而失效
    location ~* ^/(MP_verify|WW_verify)_[A-Za-z0-9]+\.txt$ {
        root /var/www/verify;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
